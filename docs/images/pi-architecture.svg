<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pi Qoder Bridge architecture</title>
  <desc id="desc">Pi sends prompts through the Qoder bridge extension to the official Qoder Agent SDK. Streamed output, model discovery, and usage return to Pi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#263b69"/></linearGradient>
    <marker id="arrow" markerHeight="8" markerWidth="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#93c5fd"/></marker>
    <style>
      .label{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fafc}
      .detail{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#bfdbfe}
      .small{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="48" y="50" class="label">Pi Qoder Bridge</text>
  <text x="48" y="76" class="small">A native Pi extension using Qoder's official SDK</text>
  <g transform="translate(50 120)">
    <rect width="245" height="132" rx="16" fill="url(#node)" stroke="#60a5fa"/>
    <text x="24" y="42" class="label">Pi</text>
    <text x="24" y="70" class="detail">conversation · model picker</text>
    <text x="24" y="98" class="small">tools · slash commands</text>
  </g>
  <g transform="translate(478 120)">
    <rect width="245" height="132" rx="16" fill="url(#node)" stroke="#a78bfa"/>
    <text x="24" y="42" class="label">Qoder extension</text>
    <text x="24" y="70" class="detail">stream adapter · auth</text>
    <text x="24" y="98" class="small">model catalog · usage</text>
  </g>
  <g transform="translate(905 120)">
    <rect width="245" height="132" rx="16" fill="url(#node)" stroke="#34d399"/>
    <text x="24" y="42" class="label">Qoder Agent SDK</text>
    <text x="24" y="70" class="detail">official Qoder runtime</text>
    <text x="24" y="98" class="small">models · agent actions · quota</text>
  </g>
  <path d="M295 166H468" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M723 166H895" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M895 207H723" stroke="#86efac" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M468 207H295" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="153" class="small">prompts · model requests</text>
  <text x="755" y="153" class="small">SDK query</text>
  <text x="758" y="233" class="small">stream · models · quota</text>
  <text x="340" y="233" class="small">Pi events · usage</text>
  <text x="50" y="310" class="small">Qoder international CLI · Qoder CN CLI · personal access token</text>
  <text x="50" y="333" class="small">Pi owns the conversation; the Qoder SDK runs its agent actions.</text>
</svg>
