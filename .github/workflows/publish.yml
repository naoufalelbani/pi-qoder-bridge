# Release automation: publishing `pi-qoder-bridge` to npm happens here, not on
# a maintainer laptop. Creating (or publishing) a GitHub release runs the
# release job, which verifies, builds, and publishes with OIDC trusted
# publishing — no long-lived npm tokens anywhere. Manual dispatch takes an
# explicit tag (GITHUB_REF_NAME would be the branch there).
#
# One-time npm setup (package Settings > Trusted Publisher, after the first
# manual publish): GitHub Actions, org/user `naoufalelbani`, repository
# `pi-qoder-bridge`, workflow file `publish.yml`, environment left empty.
# Afterwards every GitHub release publishes itself; see RELEASING.md.
name: Publish to npm

on:
  release:
    types: [published]
  # Manual re-run (e.g. first publish via token before the trusted
  # publisher is configured, or retrying a failed release publish).
  # Requires the tag explicitly: GITHUB_REF_NAME would be the branch here,
  # so the guard and checkout both use this input instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.1)"
        required: true

permissions:
  contents: read
  id-token: write

# Releases are rare and must never publish concurrently/out of order.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Guard tag/version alignment
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG || '';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const expected = tag.startsWith('v') ? tag.slice(1) : tag;
            if (!expected || pkg.version !== expected) {
              console.error(\`Tag '\${tag}' does not match package.json version \${pkg.version}; refusing to publish.\`);
              process.exit(1);
            }
            console.log(\`Release \${tag} matches package version \${pkg.version}.\`);
          "

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Ensure npm supports OIDC trusted publishing
        # setup-node's bundled npm predates OIDC (needs >= 11.5); without
        # this the failure looks like a trust misconfiguration.
        run: npm install -g npm@latest

      - name: Publish to npm
        # Two OTP-free paths, token first:
        # 1. NPM_TOKEN repo secret (automation token): works immediately,
        #    including the very first publish. No trusted publisher needed.
        # 2. Otherwise OIDC trusted publishing + provenance (requires the
        #    one-time npmjs.com package Settings > Trusted Publisher setup).
        # Prereleases publish under the `next` dist-tag so `latest` stays
        # stable; stable releases update `latest` as usual.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRERELEASE: ${{ github.event.release.prerelease == true }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            if [ "${IS_PRERELEASE}" = "true" ]; then npm publish --access public --tag next; else npm publish --access public; fi
          else
            if [ "${IS_PRERELEASE}" = "true" ]; then npm publish --provenance --access public --tag next; else npm publish --provenance --access public; fi
          fi
