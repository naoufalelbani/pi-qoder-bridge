# Release automation: publishing `pi-qoder-bridge` to npm happens here, not on
# a maintainer laptop. Creating (or publishing) a GitHub release runs the
# release job, which verifies, builds, and publishes with OIDC trusted
# publishing — no long-lived npm tokens anywhere.
#
# One-time npm setup (package Settings > Trusted Publisher, after the first
# manual publish): GitHub Actions, org/user `naoufalelbani`, repository
# `pi-qoder-bridge`, workflow file `publish.yml`, environment left empty.
# Afterwards every GitHub release publishes itself; see RELEASING.md.
name: Publish to npm

on:
  release:
    types: [published]
  # Manual re-run (e.g. first publish via token before the trusted
  # publisher is configured, or retrying a failed release publish).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Guard tag/version alignment
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME || '';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const expected = tag.startsWith('v') ? tag.slice(1) : tag;
            if (pkg.version !== expected) {
              console.error(\`Tag \${tag} does not match package.json version \${pkg.version}; refusing to publish.\`);
              process.exit(1);
            }
            console.log(\`Release \${tag} matches package version \${pkg.version}.\`);
          "

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        # Two OTP-free paths, token first:
        # 1. NPM_TOKEN repo secret (automation token): works immediately,
        #    including the very first publish. No trusted publisher needed.
        # 2. Otherwise OIDC trusted publishing + provenance (requires the
        #    one-time npmjs.com package Settings > Trusted Publisher setup).
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm publish --access public
          else
            npm publish --provenance --access public
          fi
